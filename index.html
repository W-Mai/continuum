<style>

  * { box-sizing: border-box; }
  html, body {

    font: 12px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans CJK SC", sans-serif;

  canvas { display: block; width: 100vw; height: 100vh; }

  .panel {

    background: rgba(14, 17, 21, .42);
    border: 1px solid rgba(255, 255, 255, .08);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), inset 0 -1px 0 rgba(0, 0, 0, .25);

  #hud { left: 20px; bottom: 20px; padding: 12px 16px 12px 14px; min-width: 210px; }
  #hud .place { font-size: 11px; letter-spacing: .08em; color: var(--dim); }
  #hud .speed { font-size: 34px; font-weight: 300; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #hud .speed small { font-size: 11px; color: var(--dim); margin-left: 4px; font-weight: 400; }
  #hud .row { display: flex; gap: 16px; margin-top: 4px; color: var(--dim); font-variant-numeric: tabular-nums; }

  #bar { right: 20px; bottom: 20px; display: flex; gap: 4px; padding: 5px; }
  #bar button, #bar a {
    font: inherit; color: var(--ui); cursor: pointer; text-decoration: none;
    background: transparent; border: 0; border-radius: 8px; padding: 6px 11px;
    display: inline-flex; align-items: center; gap: 6px; transition: background .15s;
  }
  #bar button:hover, #bar a:hover { background: rgba(255, 255, 255, .08); }
  #bar button[aria-pressed="true"] { background: rgba(255, 255, 255, .14); }

  #brand { left: 22px; top: 18px; position: fixed; font-size: 13px; letter-spacing: .3em; opacity: .75; }
  #brand span { letter-spacing: .2em; opacity: .7; margin-left: 8px; }

  #perf { right: 20px; top: 18px; padding: 8px 12px; font: 11px/1.6 ui-monospace, Menlo, monospace; display: none; }
  body.debug #perf { display: block; }

  body.wallpaper #hud, body.wallpaper #bar, body.wallpaper #brand, body.wallpaper #perf {
    opacity: 0; pointer-events: none; transition: opacity .8s;
  }

  #boot {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center;
    background: #0b0e12; z-index: 20; transition: opacity .8s;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .t { font-size: 14px; letter-spacing: .5em; opacity: .85; }
  #boot .s { font-size: 11px; opacity: .45; }
  #err { color: #ff8a7a; white-space: pre-wrap; font-size: 11px; text-align: left; max-width: 80ch; }
  @media (prefers-reduced-motion: reduce) { #boot, body.wallpaper #hud { transition: none; } }

<body>
<canvas id="view"></canvas>

<div id="brand">CONTINUUM<span>无限遛弯</span></div>

<div id="hud" class="panel">
  <div class="place" id="place">山间</div>

  <div class="row"><span><b id="dist">0.0</b> km</span><span>海拔 <b id="alt">0</b> m</span><span id="struct">路面</span></div>
</div>

<div id="bar" class="panel">
  <button id="btnCam" title="C">机位</button>

<script type="module">
import { Game } from './src/game.js';
import { sunVisibility } from './src/world/sunlight.js';
import { sunMask } from './src/render/atmosphere.js';

const canvas = document.getElementById('view');
const params = new URLSearchParams(location.search);
const RUN = Number(params.get('run')) || 0;
if (params.get('debug') === '1') document.body.classList.add('debug');

const fail = (e) => {
  document.getElementById('bootMsg').textContent = '启动失败';
  document.getElementById('err').textContent = String((e && e.stack) || e);
  document.title = 'GAME_FAIL: ' + String((e && e.message) || e);
};

let game;
try {
  game = new Game(canvas, {
    auto: params.get('auto') !== '0',
    seed: params.has('seed') ? Number(params.get('seed')) : undefined,
    maxPixelRatio: Number(params.get('ppr')) || undefined,
    preserveDrawingBuffer: !!RUN,
    // Headless runs build the world synchronously so every frame is complete.
    syncWorld: !!RUN,
    noShadow: params.get('noshadow') === '1',
    terrainDebug: params.get('tdebug') === '1',
    start: Number(params.get('s')) || 0,
  });
  window.game = game;
} catch (e) {
  fail(e);
}

const $ = (id) => document.getElementById(id);
const STRUCT = { ground: '路面', bridge: '高架桥', tunnel: '隧道' };
function refreshUi() {
  const s = game.snapshot();
  $('speed').textContent = Math.round(s.speedKmh);
  $('dist').textContent = (s.distance / 1000).toFixed(1);
  $('alt').textContent = Math.round(s.altitude);
  $('struct').textContent = STRUCT[s.structure] || '';
  $('btnAuto').setAttribute('aria-pressed', String(s.autoMode));
  $('fps').textContent = Math.round(s.fps) + ' fps';
  $('calls').textContent = s.drawCalls + ' calls · ' + Math.round(s.triangles / 1000) + 'k tris';
  $('tiles').textContent = s.tiles + ' tiles · ' + s.roadChunks + ' road chunks';
}

$('btnAuto').addEventListener('click', () => { game.autoMode = !game.autoMode; });
$('btnCam').addEventListener('click', () => game.cycleCamera());
$('btnWall').addEventListener('click', () => toggleWallpaper());
function toggleWallpaper() {
  const on = document.body.classList.toggle('wallpaper');
  $('btnWall').setAttribute('aria-pressed', String(on));
  if (on) {
    game.autoMode = true;
    document.documentElement.requestFullscreen?.().catch(() => {});
  } else if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
  }
}
addEventListener('keydown', (e) => {
  if (e.code === 'KeyF') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  }
  if (e.code === 'KeyH') toggleWallpaper();
});

// Diagnostics for headless runs: written into the DOM so a script can read
// the real simulation state next to the captured frame.
function emitDiag() {
  const s = game.snapshot();
  let el = $('diag');
  if (!el) {
    el = document.createElement('script');
    el.id = 'diag';
    el.type = 'application/json';
    document.body.appendChild(el);
  }
  const lat = game.road.lateralOf(game.sCar, game.car.x, game.car.z);
  const smp = game.road.samples.get(Math.round(game.sCar / 2));
  const sunRoad = smp ? sunVisibility(game.land, smp.ax, smp.az, smp.y, game.atmosphere.sunDir) : -1;
  // Presentation state, so a check can prove the wheels turn and the camera
  // lags rather than assuming the code ran.
  const pres = game.presentation;
  const car = pres && pres.loaded ? {
    wheels: pres.wheels.map((w) => ({
      name: w.name,
      steerY: +w.steer.rotation.y.toFixed(4),
      spinZ: +w.spin.rotation.z.toFixed(3),
      bounceY: +w.spin.position.y.toFixed(4),
    })),
    bodyPitch: +pres.body.rotation.x.toFixed(4),
    bodyRoll: +pres.body.rotation.z.toFixed(4),
    bodyHeave: +pres.body.position.y.toFixed(4),
  } : null;
  const cameraRig = {
    framing: game.chase.framing,
    dist: +game.chase.dist.value.toFixed(2),
    fov: +game.chase.fov.value.toFixed(1),
    yawLag: +(game.chase.yaw.value - game.car.yaw).toFixed(4),
  };
  el.textContent = JSON.stringify({ ...s, lateral: +lat.toFixed(2), camera: game.chase.framing,
    sunRoad: +sunRoad.toFixed(3), sunCar: +sunMask.value.toFixed(3), car, cameraRig });
}

let last = performance.now();
let uiClock = 0;
function tick(dt) {
  game.update(dt);
  game.render(dt);
  uiClock += dt;
  if (uiClock > 0.25) {
    uiClock = 0;
    refreshUi();
  }
}

function startLoop() {
  if (!RUN) {
    // Pause when the tab is hidden; a wallpaper should not burn a laptop.
    const frame = (now) => {
      const dt = (now - last) / 1000;
      last = now;
      if (!document.hidden) tick(dt);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    return;
  }
  // Headless: simulate RUN frames without drawing each one, then draw the last
  // and publish it. Under a virtual-time budget rAF is unreliable, so this is
  // one synchronous turn.
  try {
    for (let i = 0; i < RUN; i++) game.update(1 / 60);
    refreshUi();
    if (params.get('hideui') === '1') document.body.classList.add('wallpaper');
    game.render();
    emitDiag();
    const f = document.createElement('script');
    f.id = 'frame';
    f.type = 'text/plain';
    f.textContent = canvas.toDataURL('image/png');
    document.body.appendChild(f);
    document.title = 'GAME_DONE';
  } catch (e) {
    fail(e);
  }
}

(async () => {
  if (!game) return;
  try {
    await game.loadCar('./out/car.glb?v=60c1591656');
    game.resize(innerWidth, innerHeight);
    addEventListener('resize', () => game.resize(innerWidth, innerHeight));
    const cam = params.get('cam');
    if (cam) {
      game.chase.setFraming(cam);
      for (const k of Object.keys(game.chase.frameWeights)) game.chase.frameWeights[k] = k === cam ? 1 : 0;
    }
    game.update(1 / 60);
    game.warmUp();
    game.render();
  } catch (e) {
    fail(e);
    return;
  }
  $('boot').classList.add('gone');
  window.__ready = true;
  startLoop();
})();
</script>
</body>
