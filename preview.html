<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>跑车模型 · 交互预览</title>
<style>
  :root {
    --bg: #0d1014;
    --panel: rgba(18, 22, 28, 0.86);
    --line: rgba(120, 190, 255, 0.22);
    --text: #cfd8e3;
    --accent: #7fd4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font: 13px/1.6 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; color: var(--text); }
  canvas { display: block; }

  #hud {
    position: fixed; top: 18px; left: 18px; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; backdrop-filter: blur(12px);
    max-width: 250px; pointer-events: none;
  }
  #hud h1 { margin: 0 0 2px; font-size: 14px; letter-spacing: .04em; color: #fff; }
  #hud .sub { font-size: 11px; opacity: .55; letter-spacing: .06em; text-transform: uppercase; }
  #hud dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; }
  #hud dt { opacity: .5; }
  #hud dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

  #controls {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; padding: 8px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; backdrop-filter: blur(12px); flex-wrap: wrap;
    justify-content: center; max-width: calc(100vw - 36px);
  }
  #controls button {
    font: inherit; color: var(--text); cursor: pointer;
    background: rgba(255, 255, 255, .05); border: 1px solid transparent;
    border-radius: 7px; padding: 6px 13px; transition: .15s;
  }
  #controls button:hover { background: rgba(127, 212, 255, .14); color: #fff; }
  #controls button[aria-pressed="true"] {
    background: rgba(127, 212, 255, .2); border-color: var(--accent); color: #fff;
  }
  #hint {
    position: fixed; bottom: 18px; right: 18px; font-size: 11px; opacity: .35;
    text-align: right; pointer-events: none;
  }
  #fail {
    position: fixed; inset: 0; display: none; place-items: center;
    padding: 40px; text-align: center; background: var(--bg); z-index: 10;
  }
  #fail pre { color: #ff8a7a; font-size: 12px; text-align: left; white-space: pre-wrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./tools/vendor/three.module.js" } }
</script>
</head>
<body>
<div id="hud">
  <h1>Mid-engine Coupe</h1>
  <div class="sub">procedural · low-poly</div>
  <dl>
    <dt>长度</dt><dd>4500 mm</dd>
    <dt>宽度</dt><dd id="w">—</dd>
    <dt>高度</dt><dd id="h">—</dd>
    <dt>轴距</dt><dd>2700 mm</dd>
    <dt>三角面</dt><dd id="tris">—</dd>
  </dl>
</div>

<div id="controls">
  <button data-view="hero34" aria-pressed="true">前 3/4</button>
  <button data-view="rear34">后 3/4</button>
  <button data-view="side">正侧</button>
  <button data-view="front">正前</button>
  <button data-view="top">俯视</button>
  <button data-view="low34">低角度</button>
  <button id="wire" aria-pressed="false">线框</button>
  <button id="spin" aria-pressed="true">自动旋转</button>
</div>

<div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
<div id="fail"><div><p>模型加载失败</p><pre id="failmsg"></pre></div></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './tools/vendor/GLTFLoader.js';
import { OrbitControls } from './tools/vendor/OrbitControls.js';
import { RoomEnvironment } from './tools/vendor/environments/RoomEnvironment.js';

const fail = (why) => {
  document.getElementById('fail').style.display = 'grid';
  document.getElementById('failmsg').textContent = String(why && why.stack || why);
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0d1014');
scene.fog = new THREE.Fog('#0d1014', 9000, 17000);

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 10, 40000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2600;
controls.maxDistance = 14000;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotateSpeed = 0.9;

// A studio environment gives the metallic paint something to reflect; the
// analytic lights below still do most of the shaping.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(4200, 6200, 3200);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1000;
key.shadow.camera.far = 16000;
key.shadow.bias = -0.0006;
scene.add(key);

const rim = new THREE.DirectionalLight(0x9fd0ff, 1.5);
rim.position.set(-5200, 2600, -4200);
scene.add(rim);

const fill = new THREE.DirectionalLight(0xffd9c0, 0.7);
fill.position.set(1200, 1600, -5200);
scene.add(fill);

scene.add(new THREE.HemisphereLight(0xbcd6ff, 0x1a1f26, 0.85));

// Ground: a dark plate plus a blueprint grid, matching the wireframe preset.
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(11000, 96),
  new THREE.MeshStandardMaterial({ color: 0x14181e, roughness: 0.92, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(14000, 56, 0x2b3d4d, 0x1d2a35);
grid.material.transparent = true;
grid.material.opacity = 0.55;
grid.position.y = 0.4;
scene.add(grid);

const wireGroup = new THREE.Group();
wireGroup.visible = false;
scene.add(wireGroup);

let model = null;
let radius = 4000;

const VIEWS = {
  hero34: { az: 0.86, el: 0.26 },
  rear34: { az: -2.30, el: 0.26 },
  side: { az: Math.PI / 2, el: 0.06 },
  front: { az: 0.0, el: 0.10 },
  top: { az: 1.05, el: 1.24 },
  low34: { az: -2.05, el: 0.055 },
};

function applyView(name) {
  const v = VIEWS[name] || VIEWS.hero34;
  const d = radius * 2.45;
  camera.position.set(
    Math.sin(v.az) * Math.cos(v.el) * d,
    Math.sin(v.el) * d + radius * 0.34,
    Math.cos(v.az) * Math.cos(v.el) * d
  );
  controls.target.set(0, radius * 0.30, 0);
  controls.update();
}

for (const btn of document.querySelectorAll('#controls button[data-view]')) {
  btn.addEventListener('click', () => {
    for (const b of document.querySelectorAll('#controls button[data-view]')) {
      b.setAttribute('aria-pressed', String(b === btn));
    }
    applyView(btn.dataset.view);
  });
}

const wireBtn = document.getElementById('wire');
wireBtn.addEventListener('click', () => {
  const on = wireBtn.getAttribute('aria-pressed') !== 'true';
  wireBtn.setAttribute('aria-pressed', String(on));
  wireGroup.visible = on;
});

const spinBtn = document.getElementById('spin');
spinBtn.addEventListener('click', () => {
  const on = spinBtn.getAttribute('aria-pressed') !== 'true';
  spinBtn.setAttribute('aria-pressed', String(on));
  controls.autoRotate = on;
});
controls.autoRotate = true;

new GLTFLoader().load('./out/car.glb', (gltf) => {
  model = gltf.scene;

  let tris = 0;
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;
    const g = o.geometry;
    if (g && g.index) tris += g.index.count / 3;
    else if (g) tris += g.attributes.position.count / 3;

    const m = o.material;
    if (m && m.transparent) {
      // Glass: keep it see-through without hiding the interior behind it.
      m.depthWrite = false;
      m.side = THREE.DoubleSide;
    }

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(g, 24),
      new THREE.LineBasicMaterial({ color: 0x7fd4ff, transparent: true, opacity: 0.5 })
    );
    wireGroup.add(edges);
  });

  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const mid = box.getCenter(new THREE.Vector3());
  radius = box.getBoundingSphere(new THREE.Sphere()).radius;
  model.position.set(-mid.x, -box.min.y, -mid.z);
  scene.add(model);

  document.getElementById('w').textContent = Math.round(size.z) + ' mm';
  document.getElementById('h').textContent = Math.round(size.y) + ' mm';
  document.getElementById('tris').textContent = Math.round(tris).toLocaleString();

  applyView('hero34');
}, undefined, fail);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ?once=1 renders a single frame and stops, so a headless --dump-dom capture
// terminates instead of waiting for an animation loop that never goes idle.
const once = new URLSearchParams(location.search).get('once') === '1';
if (once) {
  renderer.render(scene, camera);
  document.title = 'PREVIEW_READY';
} else {
  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
  });
}
</script>
</body>
</html>
